{% extends 'swagmeme2010/base1.html' %}
{% block content %}
<ul>
    {% for artist in artists %}
        {% if artist.is_published %}
            <li>
            <h2>{{ artist.title }}</h2>
            <p>{{ artist.content }}</p>
            <p><a href="{% url 'castle' artist.id %}">Читать пост</a></p>
            {% if not forloop.last %}
            <hr>
            {% endif %}
            </li>
        {% endif %}
    {% endfor%}
</ul>
{% endblock %}
