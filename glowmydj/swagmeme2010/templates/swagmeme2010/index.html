<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{{ title }}</title>
</head>
<body>
<header>
    <p>{{ menu|join:' | ' }}</p>
    <h1>{{ title }}</h1>
</header>
<main>
    <ul>
        {% for artist in artists %}
            {% if artist.is_published %}
            <h2>{{ artist.title }}</h2>
            <p>{{ artist.content }}</p>
            <p><a href="{% url 'castle' artist.id %}">Читать пост</a></p>
            {% endif %}
            {% if not forloop.last %}
            <hr>
            {% endif %}
        {% endfor%}
    </ul>
</main>
</body>
</html>
