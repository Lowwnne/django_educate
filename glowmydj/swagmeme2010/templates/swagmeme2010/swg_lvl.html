{% extends 'swagmeme2010/base1.html' %}
{% block content %}
<ul>
    {% for artist in artists %}
    <li>
        <h2>{{ forloop.counter }}. {{ artist.title }}</h2>
        <p>{{ artist.listeners }}</p>
        {% if not forloop.last %}
        <hr>
        {% endif %}
    </li>
    {% endfor%}
</ul>
{% endblock %}
